    - Associate's degree
    - Bachelor's degree
    - College graduate/some postgrad
    - Master's degree
    - Professional degree
    - Doctoral degree
    - Postgraduate
    - Graduate or professional degree
    # Binary higher-education levels (kantorowicz2026)
    - Below higher education
    - Higher education
    # ISCED international levels (issp, wvs7)
    - No formal education
    - No formal education, incomplete primary
    - Early childhood or no education
    - Primary education
    - Lower secondary education
    - Upper secondary education
    - Post-secondary non-tertiary education
    - Lower level tertiary, first stage
    - Short-cycle tertiary education
    - Upper level tertiary (Master, Doctor)
    - PhD, post-tertiary specialization
