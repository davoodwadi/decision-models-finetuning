# Global persona attribute specifications (single source of truth).
# Each attribute defines:
#   prompt:    human-readable label shown in model prompts
#   levels:    allowed canonical string values (raw values already in levels pass through)
#   aliases:   (optional) raw value -> canonical level (shared across all datasets)
#   missing:   (optional) raw values mapped to NaN
#   overrides: (optional) dataset -> {raw value -> canonical level or null}

country:
  prompt: Country
  levels:
    - United States
    - Canada
  aliases:
    US: United States

gender:
  prompt: Gender
  levels:
    - Male
    - Female
    - Non-binary
    - Other
    - Prefer not to say
  aliases:
    "1. Male": Male
    "2. Female": Female
    Man: Male
    Woman: Female
    "Prefer not to answer": Prefer not to say
    "Prefer to self-describe": Other
  missing:
    - "-9. No answer"
    # hints7 (BirthSex = 3)
    - "Don't know"

age:
  prompt: Age
  levels:
    # US Census 6-bin (used for exact numeric ages in issp, wvs7, covid, grummon2023, grummon2025, kriner2026; native in berke2023, wu2025)
    - 18-24
    - 25-34
    - 35-44
    - 45-54
    - 55-64
    - 65+
    # Other survey brackets (kept as union levels with unified wording)
    - 18-29
    - 30-49
    - 50-64
    - 30-44
    - 45-64
    - 65-74
    - 75-84
    - 85+
    - Younger
    - Older
  numeric_bins:
    - {min: 18, max: 24, label: 18-24}
    - {min: 25, max: 34, label: 25-34}
    - {min: 35, max: 44, label: 35-44}
    - {min: 45, max: 54, label: 45-54}
    - {min: 55, max: 64, label: 55-64}
    - {min: 65, max: 120, label: 65+}
  aliases:
    "18 - 24": 18-24
    "25 - 34": 25-34
    "35 - 44": 35-44
    "45 - 54": 45-54
    "55 - 64": 55-64
    "65 - 74": 65-74
    "75 - 84": 75-84
    "18 - 24 years": 18-24
    "25 - 34 years": 25-34
    "35 - 44 years": 35-44
    "45 - 54 years": 45-54
    "55 - 64 years": 55-64
    "65 or older": 65+
    "65 - 74 years": 65-74
    "75 - 84 years": 75-84
    "85 or older": 85+
    "18 to 29": 18-29
    "30 to 44": 30-44
    "45 to 64": 45-64
    "89. 89 years; US: 89 years or more": 65+
    "89. 89 years old; US: 89 years or more": 65+
    "89. 89 years; US: 89 years or older": 65+
    "89 (US: 89 years or older)": 65+
  missing:
    - "-9. No answer"
    - "No answer"
    - "999. No answer"

region:
  prompt: Region
  levels:
    # 4 US Census regions (subpop, covid, berke2023, kriner2026, wu2025, magistro2025 US, twin2k)
    - Northeast
    - Midwest
    - South
    - West
    # Twin-2K non-contiguous Pacific and contiguous West (kept distinct from full US Census West)
    - Pacific (HI, AK)
    - West (excluding HI, AK)
    # ISSP 9 US Census divisions (kept as union levels without collapsing)
    - New England
    - Middle Atlantic
    - East North Central
    - West North Central
    - South Atlantic
    - East South Central
    - West South Central
    - Mountain
    - Pacific
  aliases:
    # Strip ISSP numeric prefixes ("1. New England" -> "New England")
    "1. New England": New England
    "2. Middle Atlantic": Middle Atlantic
    "3. East North Central": East North Central
    "4. West North Central": West North Central
    "5. South Atlantic": South Atlantic
    "6. East South Central": East South Central
    "7. West South Central": West South Central
    "8. Mountain": Mountain
    "9. Pacific": Pacific
    # Strip Twin-2K parenthetical state lists
    "Northeast (PA, NY, NJ, RI, CT, MA, VT, NH, ME)": Northeast
    "Midwest (ND, SD, NE, KS, MN, IA, MO, WI, IL, MI, IN, OH)": Midwest
    "South (TX, OK, AR, LA, KY, TN, MS, AL, WV, DC, MD, DE, VA, NC, SC, GA, FL)": South
    "West (WA, OR, ID, MT, WY, CA, NV, UT, CO, AZ, NM)": West (excluding HI, AK)
    # shed2025 (ppreg9 hyphenated Census divisions)
    "Mid-Atlantic": Middle Atlantic
    "East-North Central": East North Central
    "West-North Central": West North Central
    "East-South Central": East South Central
    "West-South Central": West South Central

