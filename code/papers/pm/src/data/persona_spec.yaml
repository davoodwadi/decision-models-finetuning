      "Some College": Some college, no degree
    kriner2026:
      "Some College": Some college, no degree
  missing:
    - "-9. No answer"
    - "-9. No answer, not classifiable"
    - "-9. No answer, not elsewhere classified"
    - "9. No answer"
    - "No answer"
    - "No answer, other"

