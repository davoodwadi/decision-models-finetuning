    "8. PhD, Post Tertiary Specialization": PhD, post-tertiary specialization
    "8. PhD, Post tertiary specialization": PhD, post-tertiary specialization
  overrides:
    # covid and kriner2026 have a separate "2-year College Degree" option, so "Some College" means no degree;
    # magistro2025 has no Associate's option, so its "Some college" stays "Some college".
