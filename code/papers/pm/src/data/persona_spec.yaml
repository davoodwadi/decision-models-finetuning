    "High school graduate (high school diploma or equivalent including GED)": High school graduate
    "Some college but no degree": Some college, no degree
    "2-year College Degree": Associate's degree
    "Associate degree in college (2-year)": Associate's degree
    "4-year College Degree": Bachelor's degree
    "Bachelor's degree in college (4-year)": Bachelor's degree
    "College grad": Bachelor's degree
    "6. Lower level tertiary, BA": Bachelor's degree
    "6. Lower tertiary, BA": Bachelor's degree
    "Bachelor or equivalent (ISCED 6)": Bachelor's degree
    "Master's Degree": Master's degree
    "7. Upper level tertiary, MA": Master's degree
    "7. Upper tertiary, MA": Master's degree
