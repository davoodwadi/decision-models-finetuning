    "Associate degree": Associate's degree
    "Bachelor\u2019s degree": Bachelor's degree
    "Master\u2019s degree": Master's degree
    "Professional degree (e.g., MBA, MD, JD)": Professional degree
    "Below higher edu.": Below higher education
    "Higher edu.": Higher education
    # ISCED prefix stripping & Stata truncation cleanup
    "0. No formal education": No formal education
    "0. No (formal) education, incomplete primary": No formal education, incomplete primary
    "0. No education, incomplete primary": No formal education, incomplete primary
    "Early childhood education (ISCED 0) / no education": Early childhood or no education
    "1. Primary education": Primary education
    "1. Primary school": Primary education
    "1. Primary school (elementary education)": Primary education
    "Primary school (elementary education)": Primary education
    "2. Lower secondary": Lower secondary education
    "2. Lower secondary education": Lower secondary education
    "2. Lower secondary (secondary completed that does not allow entry to university: end of obligatory school)": Lower secondary education
    "Lower secondary (secondary completed that does not allow entry to university: end of obligatory school)": Lower secondary education
    "Lower secondary (secondary completed does not allow entry to": Lower secondary education
    "Lower secondary (secondary completed that does not allow ent": Lower secondary education
    "Lower secondary education (ISCED 2)": Lower secondary education
    "3. Upper secondary": Upper secondary education
    "3. Upper secondary education": Upper secondary education
    "3. Upper secondary (programs that allow entry to university)": Upper secondary education
    "3. Upper secondary (programs that allows entry to university)": Upper secondary education
    "Upper secondary (programs that allows entry to university)": Upper secondary education
    "Upper secondary (programs that allows entry to university": Upper secondary education
    "Upper secondary education (ISCED 3)": Upper secondary education
    "4. Post secondary, non-tertiary (other upper secondary programs toward the labour market or technical formation)": Post-secondary non-tertiary education
    "Post secondary, non-tertiary (other upper secondary programs toward the labour market or technical formation)": Post-secondary non-tertiary education
    "Post secondary, non-tertiary (other upper secondary programs": Post-secondary non-tertiary education
    "Post-secondary non-tertiary education (ISCED 4)": Post-secondary non-tertiary education
    "5. Lower level tertiary, first stage (also technical schools at a tertiary level)": Lower level tertiary, first stage
    "Lower level tertiary, first stage (also technical schools at a tertiary level)": Lower level tertiary, first stage
